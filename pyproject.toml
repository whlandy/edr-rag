[project]
name = "edr-rag"
version = "0.1.0"
description = "CHM manual ingestion, retrieval, action catalog, and feedback tooling for EDR agents"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "fastmcp>=3.1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
# Optional RAG stack: enables embedding-based retrieval (vector_search), the
# cross-encoder reranker (bge-reranker) stage of hybrid search, and the
# LlamaIndex ingestion pipeline (ingest-llama). Absent these, retrieval
# gracefully falls back to keyword / BM25 / RRF fusion and ingestion to a
# stdlib splitter.
rag = [
    "llama-index-core>=0.10.0",
    "llama-index-embeddings-huggingface>=0.1.0",
    "sentence-transformers>=2.2.0",
    "FlagEmbedding>=1.2.0",  # bge-reranker
    # P3-4 OCR extras 也并入 rag：一键安装全能力。
    "Pillow>=9.0.0",
    "pytesseract>=0.3.10",
]
# Optional OCR stack (P3-4): 让 CHM 内截图/图片的文字可被识别并检索。
# 注意 pytesseract 还需系统 tesseract 二进制 + 对应 tessdata (chi_sim/eng);
# rapidocr-onnxruntime 为纯 Python 兜底（内置中英文，无系统依赖）。
# 两者都缺时 OCR 优雅降级跳过，主链路不受影响。
ocr = [
    "Pillow>=9.0.0",
    "pytesseract>=0.3.10",
    "rapidocr-onnxruntime>=1.3.0",
]

[project.scripts]
edr-rag = "edr_rag.cli:main"
edr-rag-p1 = "edr_rag.p1.cli:main"
edr-rag-p2 = "edr_rag.p2.cli:main"
edr-rag-mcp = "edr_rag.p3.server:main"
edr-rag-trace = "edr_rag.p3.trace_cli:main"
edr-rag-eval = "edr_rag.eval.cli:main"
# P4: HTTP 服务（纯 stdlib，内网离线部署不引入 fastapi/uvicorn）。
edr-rag-serve = "edr_rag.service.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edr_rag"]
# 随包携带评测集数据 (JSONL) 与查询扩展词表 (P4)，保证安装后
# edr-rag-eval 与 expand_query 都能直接使用。
force-include = { "edr_rag/eval/data" = "edr_rag/eval/data", "edr_rag/data" = "edr_rag/data" }

[tool.pytest.ini_options]
testpaths = ["edr_rag"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
# 本项目的注释与 docstring 是中文，且解释性内容较多；88 列会逼着把
# 一句完整的中文说明拆成三行，反而更难读。
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",   # 行宽由 line-length 控制，不再单独报
    "B008",   # 参数默认值里调用函数——本项目没有这个模式，避免误报
    "UP038",  # isinstance 元组写法，改动收益不抵审阅成本
]

[tool.ruff.lint.per-file-ignores]
# 测试里大量使用夹具与延迟导入，放宽未使用导入/变量的检查。
"**/test_*.py" = ["F401", "F811", "B011"]
