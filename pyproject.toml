[project]
name = "edr-rag"
version = "0.1.0"
description = "CHM manual ingestion, retrieval, action catalog, and feedback tooling for EDR agents"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "fastmcp>=3.1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
rag = [
    "llama-index-core>=0.12,<0.15",
    "llama-index-embeddings-huggingface>=0.5,<0.8",
]

[project.scripts]
edr-rag = "edr_rag.cli:main"
edr-rag-p1 = "edr_rag.p1.cli:main"
edr-rag-p2 = "edr_rag.p2.cli:main"
edr-rag-mcp = "edr_rag.p3.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edr_rag"]

[tool.pytest.ini_options]
testpaths = ["edr_rag"]
pythonpath = ["."]
