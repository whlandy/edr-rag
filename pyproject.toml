[project]
name = "edr-rag"
version = "0.1.0"
description = "CHM manual ingestion, retrieval, action catalog, and feedback tooling for EDR agents"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "fastmcp>=3.1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
# Optional RAG stack: enables embedding-based retrieval (vector_search), the
# cross-encoder reranker (bge-reranker) stage of hybrid search, and the
# LlamaIndex ingestion pipeline (ingest-llama). Absent these, retrieval
# gracefully falls back to keyword / BM25 / RRF fusion and ingestion to a
# stdlib splitter.
rag = [
    "llama-index-core>=0.10.0",
    "llama-index-embeddings-huggingface>=0.1.0",
    "sentence-transformers>=2.2.0",
    "FlagEmbedding>=1.2.0",  # bge-reranker
]

[project.scripts]
edr-rag = "edr_rag.cli:main"
edr-rag-p1 = "edr_rag.p1.cli:main"
edr-rag-p2 = "edr_rag.p2.cli:main"
edr-rag-mcp = "edr_rag.p3.server:main"
edr-rag-trace = "edr_rag.p3.trace_cli:main"
edr-rag-eval = "edr_rag.eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edr_rag"]
# 随包携带评测集数据 (JSONL)，保证安装后 edr-rag-eval 可直接使用。
force-include = { "edr_rag/eval/data" = "edr_rag/eval/data" }

[tool.pytest.ini_options]
testpaths = ["edr_rag"]
pythonpath = ["."]
